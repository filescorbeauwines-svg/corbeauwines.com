<!-- Es un portal privado de pedidos: no tiene por qué estar en un buscador. -->
<meta name="robots" content="noindex,nofollow">

<!--
  Página puente hacia el sistema de pedidos.

  Por qué una página y no una regla en _redirects: el destino termina en un
  fragmento (#/login) que resuelve el router de la aplicación en el navegador.
  En el formato _redirects el «#» es el carácter de comentario, y la
  documentación de Netlify solo aclara que se ignoran las líneas que EMPIEZAN
  con «#» — no dice qué hace con uno en medio de una línea. Si el parser lo
  cortara, el visitante caería en https://atuq.net.ar/scb/ sin el fragmento, y
  ahí queda a merced de lo que decida el router: se comprobó que esa URL sirve
  solo el armazón de la aplicación (título «SCB» y un spinner), así que no hay
  garantía de que aterrice en el login.

  Una página, en cambio, se puede probar antes de publicar, y sigue funcionando
  igual si el sitio se muda a Wix o a cualquier otro alojamiento.

  El salto va por tres vías, de la más rápida a la más resistente:
    1. location.replace  · instantáneo, y no deja entrada en el historial, para
                            que el botón «atrás» vuelva de donde vino el visitante
                            y no rebote otra vez hacia acá.
    2. meta refresh      · funciona con JavaScript desactivado.
    3. enlace visible    · si las dos fallan, o si el sistema de pedidos tarda,
                            queda algo donde hacer clic en vez de una pantalla muda.
-->
<meta http-equiv="refresh" content="0;url=https://atuq.net.ar/scb/#/login">
<link rel="canonical" href="https://atuq.net.ar/scb/#/login">

  }

  .ir{
    display:inline-flex;align-items:center;gap:.7rem;
    padding:1.05em 2.1em;border:1px solid currentColor;
    color:var(--bordeaux);text-decoration:none;
    font-size:clamp(.7rem,.3vw + .62rem,.8rem);
    text-transform:uppercase;letter-spacing:.14em;
    transition:background .2s ease,color .2s ease;
  }
  .ir:hover,.ir:focus-visible{background:var(--bordeaux);color:var(--paper);}
  .ir svg{width:19px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;}
  :focus-visible{outline:2px solid var(--bordeaux);outline-offset:3px;}
  @media (prefers-reduced-motion:no-preference){
    body{animation:entrar .4s ease both;}
    @keyframes entrar{from{opacity:0}to{opacity:1}}
  }
</style>
